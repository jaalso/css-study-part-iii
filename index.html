<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0e1a">
<title>M1 Flashcards</title>
<style>
:root{--bg:#0a0e1a;--panel:#111827;--border:#2b3a52;--ink:#e5edf7;--dim:#94a3b8;--faint:#64748b;--accent:#22d3ee;--green:#4ade80;--red:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
header{padding:10px 14px 6px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid #1f2937}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.title{font-size:15px;font-weight:700}
.title span{color:var(--faint);font-weight:400;font-size:12px}
.reset{font-size:11px;color:var(--faint);background:none;border:1px solid var(--border);border-radius:16px;padding:4px 10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;font-size:12px;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--panel);color:var(--dim);flex-shrink:0}
.chip.active{background:var(--accent);color:#04121a;border-color:var(--accent);font-weight:600}
.bar{height:5px;background:#1f2937;border-radius:3px;margin:8px 0 4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .25s}
.meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim)}
.meta label{display:flex;align-items:center;gap:5px}
main{padding:10px 14px calc(16px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto}
.counter{text-align:center;font-size:12px;color:var(--faint);margin:2px 0 8px}
.flashcard{background:#fff;color:#111;border-radius:16px;min-height:54vh;padding:18px 18px 16px;box-shadow:0 8px 26px rgba(0,0,0,.45);cursor:pointer;display:flex;flex-direction:column;position:relative}
.badge{position:absolute;top:14px;right:16px;font-size:11px;color:var(--green);font-weight:700}
.cat{align-self:flex-start;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border:1px solid;border-radius:20px;padding:2px 9px;margin-bottom:13px}
.q{font-size:19px;font-weight:700;line-height:1.34;color:#111}
.a{font-size:14.6px;line-height:1.5;color:#222}
.a b{color:#000}.a i{color:#555;font-style:italic}
.dia{margin-top:13px;background:#fafafa;border:1px solid #eee;border-radius:9px;padding:8px}
.dia svg{width:100%;height:auto;max-height:210px;display:block}
.hint{margin-top:auto;text-align:center;font-size:12px;color:#9ca3af;padding-top:14px}
.controls{display:flex;gap:10px;margin-top:13px}
.controls button{flex:1;padding:15px;font-size:15px;font-weight:700;border-radius:13px;border:none;color:#fff}
.again{background:#7f1d1d}.got{background:#14532d}
.nav{display:flex;gap:9px;margin-top:9px}
.nav button{flex:1;padding:12px;border-radius:11px;background:var(--panel);color:var(--dim);border:1px solid var(--border);font-size:14px}
.done{text-align:center;padding:46px 20px;color:var(--dim)}
.done h2{color:var(--green);font-size:20px}
.done button{margin-top:14px;padding:12px 22px;border-radius:11px;background:var(--accent);color:#04121a;border:none;font-weight:700;font-size:15px}
</style></head><body>
<header>
  <div class="top"><div class="title">M1 Flashcards <span id="sub"></span></div><button class="reset" onclick="resetKnown()">reset</button></div>
  <div class="chips" id="chips"></div>
  <div class="bar"><i id="barfill"></i></div>
  <div class="meta"><span id="prog"></span><label><input type="checkbox" id="uonly" onchange="toggleUnknown()"> unknown only</label></div>
</header>
<main>
  <div class="counter" id="counter"></div>
  <div id="stage"></div>
</main>
<script>
const CARDS=[{"cat": "Leadership Styles", "q": "What are the 7 primary leadership styles, and the big idea behind them?", "a": "<b>Idea:</b> there is no single &lsquo;best&rsquo; style &mdash; leadership is situation-bound, so you <b>match the style to the situation</b>.<br><b>The 7:</b> 1 Autocratic &middot; 2 Authoritative (Visionary) &middot; 3 Pacesetting &middot; 4 Democratic &middot; 5 Coaching &middot; 6 Affiliative &middot; 7 Laissez-Faire.<br><b>Hook:</b> each has a signature phrase (see the next cards).", "dia": ""}, {"cat": "Leadership Styles", "q": "Autocratic style &mdash; phrase, how it works, when to use?", "a": "<b>Phrase:</b> &ldquo;Do as I say.&rdquo;<br><b>How:</b> the leader makes all the decisions with little input.<br><b>Use:</b> a crucial decision on the spot when you have the most knowledge; inexperienced team; no time to wait. <b>Risk:</b> low engagement &amp; ownership.<br><b>Example:</b> an active incident &mdash; you direct the response, no debate.", "dia": ""}, {"cat": "Leadership Styles", "q": "Authoritative (Visionary) style &mdash; phrase, strength?", "a": "<b>Phrase:</b> &ldquo;Follow me.&rdquo;<br><b>How:</b> confident leader maps the way, sets expectations, <i>explains the thinking</i>, and leaves people latitude on how to get there.<br><b>Use:</b> uncertainty / change, when the team needs direction and orientation.<br><b>Example:</b> a reorg &mdash; you paint a clear picture of where the team is heading and why.", "dia": ""}, {"cat": "Leadership Styles", "q": "Pacesetting style &mdash; phrase, risk?", "a": "<b>Phrase:</b> &ldquo;Do as I do.&rdquo;<br><b>How:</b> a very driven leader sets a high bar and pushes hard, modelling the pace.<br><b>Use:</b> short sprints with a skilled, motivated team. <b>Risk:</b> over time it causes stress and burnout.<br><b>Example:</b> a small expert team racing to ship a product before a deadline.", "dia": ""}, {"cat": "Leadership Styles", "q": "Democratic style &mdash; phrase, benefit?", "a": "<b>Phrase:</b> &ldquo;What do you think?&rdquo;<br><b>How:</b> shares information and seeks opinions before deciding.<br><b>Benefit:</b> trust, team spirit, creativity, shared ownership &mdash; people do what&rsquo;s needed in a way <i>they</i> chose. <b>Risk:</b> slow decisions.<br><b>Example:</b> designing a new process &mdash; the team debates and agrees it together.", "dia": ""}, {"cat": "Leadership Styles", "q": "Coaching style &mdash; phrase, purpose?", "a": "<b>Phrase:</b> &ldquo;Consider this&hellip;&rdquo;<br><b>How:</b> sees people as talent to develop; gives a little direction to unlock their potential.<br><b>Use:</b> developing juniors / future leaders. <b>Risk:</b> feels slow for people who just want to be told what to do.<br><b>Example:</b> guiding a junior analyst to work out an investigation rather than handing them the answer.", "dia": ""}, {"cat": "Leadership Styles", "q": "Affiliative style &mdash; phrase, focus?", "a": "<b>Phrase:</b> &ldquo;People come first.&rdquo;<br><b>How:</b> gets close to people, supports their emotional needs, builds harmony.<br><b>Use:</b> after conflict or in high stress &mdash; team healing and bonding. <b>Risk:</b> tough feedback gets avoided, so performance issues linger.<br><b>Example:</b> rebuilding morale after a stressful outage.", "dia": ""}, {"cat": "Leadership Styles", "q": "Laissez-Faire style &mdash; phrase, when it works?", "a": "<b>Phrase:</b> &ldquo;You figure it out.&rdquo;<br><b>How:</b> hands off &mdash; maximum autonomy, room for experts to shine.<br><b>Use:</b> a mature, self-driven expert team with clear goals. <b>Risk:</b> lack of direction, hidden chaos, unclear priorities.<br><b>Example:</b> your manager with a senior team that already knows its duties.", "dia": ""}, {"cat": "Leadership Styles", "q": "Exam opener: &lsquo;how does your manager lead?&rsquo; &mdash; how to answer?", "a": "Give a <b>4-part answer</b>: (1) <b>name</b> the style &mdash; laissez-faire; (2) <b>why it works</b> &mdash; a senior team that knows its duties; (3) <b>when it fails</b> &mdash; cross-team alignment, where no one steers; (4) <b>which you&rsquo;d switch to</b> &mdash; democratic, to pull people together. This shows you understand <i>situational</i> leadership, not just a label.", "dia": ""}, {"cat": "Communication", "q": "What is Nonviolent Communication (NVC), and what are its 4 steps?", "a": "<b>What:</b> <b>Nonviolent Communication</b> &mdash; a method (Marshall Rosenberg, 1960s) for raising something difficult or giving feedback <b>without blame</b>, so the other person can hear you instead of getting defensive.<br><b>The 4 steps:</b> 1&nbsp;<b>Observation</b> &mdash; the plain fact, no judgement; 2&nbsp;<b>Feeling</b> &mdash; how you feel; 3&nbsp;<b>Need</b> &mdash; the need behind the feeling; 4&nbsp;<b>Request</b> &mdash; a concrete, doable ask.<br><b>Example:</b> &ldquo;When the report came in two days late <i>(observation)</i>, I felt stressed <i>(feeling)</i> because I need time to review before the deadline <i>(need)</i>. Could we agree you send it by Wednesday? <i>(request)</i>&rdquo;<br><b>Key:</b> a request is an invitation, not a demand.", "dia": "<svg viewBox=\"0 0 440 54\" font-family=\"Arial\"><rect x=\"3\" y=\"13\" width=\"96\" height=\"30\" rx=\"4\" fill=\"#ecfeff\" stroke=\"#0e7490\"/><text x=\"51\" y=\"32\" fill=\"#0e7490\" font-size=\"9.5\" text-anchor=\"middle\">1 Observation</text><rect x=\"117\" y=\"13\" width=\"80\" height=\"30\" rx=\"4\" fill=\"#fffbeb\" stroke=\"#b45309\"/><text x=\"157\" y=\"32\" fill=\"#b45309\" font-size=\"9.5\" text-anchor=\"middle\">2 Feeling</text><rect x=\"215\" y=\"13\" width=\"72\" height=\"30\" rx=\"4\" fill=\"#f0fdf4\" stroke=\"#15803d\"/><text x=\"251\" y=\"32\" fill=\"#15803d\" font-size=\"9.5\" text-anchor=\"middle\">3 Need</text><rect x=\"305\" y=\"13\" width=\"84\" height=\"30\" rx=\"4\" fill=\"#f5f3ff\" stroke=\"#6d28d9\"/><text x=\"347\" y=\"32\" fill=\"#6d28d9\" font-size=\"9.5\" text-anchor=\"middle\">4 Request</text><text x=\"107\" y=\"32\" fill=\"#888\" font-size=\"12\" text-anchor=\"middle\">&#8250;</text><text x=\"205\" y=\"32\" fill=\"#888\" font-size=\"12\" text-anchor=\"middle\">&#8250;</text><text x=\"295\" y=\"32\" fill=\"#888\" font-size=\"12\" text-anchor=\"middle\">&#8250;</text></svg>"}, {"cat": "Communication", "q": "What is the Four-Ear Model (Four Sides Model)?", "a": "<b>What:</b> (Schulz von Thun) every message is spoken on <b>four channels at once</b>, and the listener hears it through one of four &lsquo;ears&rsquo; &mdash; a mismatch is the misunderstanding.<br><b>The 4 sides:</b> 1&nbsp;Factual (the facts) &middot; 2&nbsp;Appeal (what I want you to do) &middot; 3&nbsp;Relationship (how we get along) &middot; 4&nbsp;Self-revelation (what it says about me).<br><b>Example</b> &mdash; a passenger says &ldquo;The light is green!&rdquo;: Factual = it&rsquo;s green; Appeal = go!; Relationship = you should&rsquo;ve noticed; Self-revelation = I&rsquo;m impatient. If the driver hears the <i>relationship</i> ear (&ldquo;you think I can&rsquo;t drive&rdquo;), a row starts &mdash; though only &ldquo;go&rdquo; was meant.", "dia": "<svg viewBox=\"0 0 420 152\" font-family=\"Arial\"><rect x=\"165\" y=\"56\" width=\"90\" height=\"40\" rx=\"5\" fill=\"#f0f9ff\" stroke=\"#0e7490\" stroke-width=\"1.4\"/><text x=\"210\" y=\"81\" fill=\"#0e7490\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\">MESSAGE</text><line x1=\"210\" y1=\"56\" x2=\"210\" y2=\"32\" stroke=\"#15803d\"/><line x1=\"210\" y1=\"96\" x2=\"210\" y2=\"120\" stroke=\"#b45309\"/><line x1=\"165\" y1=\"76\" x2=\"126\" y2=\"76\" stroke=\"#6d28d9\"/><line x1=\"255\" y1=\"76\" x2=\"294\" y2=\"76\" stroke=\"#1d4ed8\"/><text x=\"210\" y=\"24\" fill=\"#15803d\" font-size=\"10\" text-anchor=\"middle\">1 Factual (the facts)</text><text x=\"210\" y=\"136\" fill=\"#b45309\" font-size=\"10\" text-anchor=\"middle\">2 Appeal (do this)</text><text x=\"122\" y=\"73\" fill=\"#6d28d9\" font-size=\"10\" text-anchor=\"end\">4 Self-revelation</text><text x=\"122\" y=\"85\" fill=\"#6d28d9\" font-size=\"9\" text-anchor=\"end\">(about me)</text><text x=\"298\" y=\"73\" fill=\"#1d4ed8\" font-size=\"10\" text-anchor=\"start\">3 Relationship</text><text x=\"298\" y=\"85\" fill=\"#1d4ed8\" font-size=\"9\" text-anchor=\"start\">(how we get along)</text></svg>"}, {"cat": "Communication", "q": "What is the Johari Window?", "a": "<b>What:</b> a 2&times;2 map of <b>self-awareness</b> &mdash; it splits what&rsquo;s known about you between yourself and others.<br><b>The 4 panes:</b> <b>Open</b> (self &amp; others see), <b>Blind</b> (others see, you don&rsquo;t), <b>Hidden</b> (you know, others don&rsquo;t), <b>Unknown</b> (nobody sees yet).<br><b>How it grows:</b> <b>feedback</b> shrinks your Blind area; <b>disclosure</b> (sharing) shrinks your Hidden area &mdash; both grow the Open area = more trust.<br><b>Example:</b> a colleague points out that you interrupt in meetings (a Blind spot) &mdash; now it&rsquo;s Open and you can work on it.", "dia": "<svg viewBox=\"0 0 300 172\" font-family=\"Arial\"><text x=\"97\" y=\"11\" fill=\"#888\" font-size=\"8\" text-anchor=\"middle\">known to self</text><text x=\"228\" y=\"11\" fill=\"#888\" font-size=\"8\" text-anchor=\"middle\">not to self</text><rect x=\"34\" y=\"18\" width=\"128\" height=\"64\" fill=\"#f0fdf4\" stroke=\"#15803d\"/><text x=\"98\" y=\"46\" fill=\"#15803d\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\">OPEN</text><text x=\"98\" y=\"62\" fill=\"#888\" font-size=\"7.5\" text-anchor=\"middle\">self &amp; others see</text><rect x=\"162\" y=\"18\" width=\"128\" height=\"64\" fill=\"#fef2f2\" stroke=\"#b91c1c\"/><text x=\"226\" y=\"46\" fill=\"#b91c1c\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\">BLIND</text><text x=\"226\" y=\"62\" fill=\"#888\" font-size=\"7.5\" text-anchor=\"middle\">others see, you don&apos;t</text><rect x=\"34\" y=\"82\" width=\"128\" height=\"64\" fill=\"#fffbeb\" stroke=\"#b45309\"/><text x=\"98\" y=\"110\" fill=\"#b45309\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\">HIDDEN</text><text x=\"98\" y=\"126\" fill=\"#888\" font-size=\"7.5\" text-anchor=\"middle\">you know, they don&apos;t</text><rect x=\"162\" y=\"82\" width=\"128\" height=\"64\" fill=\"#f8fafc\" stroke=\"#94a3b8\"/><text x=\"226\" y=\"110\" fill=\"#555\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\">UNKNOWN</text><text x=\"226\" y=\"126\" fill=\"#888\" font-size=\"7.5\" text-anchor=\"middle\">nobody sees yet</text><text x=\"22\" y=\"50\" fill=\"#888\" font-size=\"8\" text-anchor=\"middle\" transform=\"rotate(-90 22 50)\">known to others</text><text x=\"22\" y=\"114\" fill=\"#888\" font-size=\"8\" text-anchor=\"middle\" transform=\"rotate(-90 22 114)\">not to others</text></svg>"}, {"cat": "Communication", "q": "What is the Iceberg Model of Competencies?", "a": "<b>What:</b> a person&rsquo;s competence is like an iceberg &mdash; a small visible part sits above the surface, but the larger part that really drives behaviour is hidden below.<br><b>Above (visible):</b> Skills &middot; Knowledge &middot; Experience.<br><b>Below (hidden drivers):</b> Social Role &amp; Values &middot; Self-Image &middot; Traits &middot; Motives.<br><b>Example:</b> two engineers hold the same certificates (visible skills), yet one thrives and one doesn&rsquo;t &mdash; the difference is below the line (motives, self-image, values). In conflict, visible &lsquo;resistance&rsquo; is often driven by a hidden motive like fear of losing expertise with a new tool.", "dia": "<svg viewBox=\"0 0 300 188\" font-family=\"Arial\"><text x=\"150\" y=\"15\" fill=\"#0e7490\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"bold\">Skills · Knowledge · Experience</text><text x=\"150\" y=\"26\" fill=\"#888\" font-size=\"8\" text-anchor=\"middle\">(visible &mdash; what you hire for)</text><line x1=\"0\" y1=\"60\" x2=\"300\" y2=\"60\" stroke=\"#1d4ed8\" stroke-dasharray=\"4 3\"/><text x=\"296\" y=\"56\" fill=\"#1d4ed8\" font-size=\"8\" text-anchor=\"end\">waterline</text><polygon points=\"150,30 186,60 114,60\" fill=\"#eff6ff\" stroke=\"#0e7490\"/><polygon points=\"114,60 186,60 244,180 56,180\" fill=\"#eef2ff\" stroke=\"#6d28d9\"/><text x=\"150\" y=\"86\" fill=\"#6d28d9\" font-size=\"9\" text-anchor=\"middle\">Social Role &amp; Values</text><text x=\"150\" y=\"108\" fill=\"#6d28d9\" font-size=\"9\" text-anchor=\"middle\">Self-Image</text><text x=\"150\" y=\"130\" fill=\"#6d28d9\" font-size=\"9\" text-anchor=\"middle\">Traits</text><text x=\"150\" y=\"152\" fill=\"#6d28d9\" font-size=\"9\" text-anchor=\"middle\">Motives</text><text x=\"150\" y=\"172\" fill=\"#888\" font-size=\"8\" text-anchor=\"middle\">(hidden &mdash; what really drives)</text></svg>"}, {"cat": "Communication", "q": "What is the Pendleton Feedback Method?", "a": "<b>What:</b> a structured, respectful way to give feedback where the <b>learner speaks first</b>, so it&rsquo;s a two-way conversation, not a verdict.<br><b>The 4 steps (they speak &rarr; you add):</b><br>1&nbsp;They say what went <b>well</b>.<br>2&nbsp;You <b>add</b> what you thought went well.<br>3&nbsp;They say what they&rsquo;d do <b>differently</b> next time.<br>4&nbsp;You <b>add</b> what you&rsquo;d have done differently.<br><b>Note:</b> step 3 asks &ldquo;differently&rdquo;, not &ldquo;wrong&rdquo; &mdash; that removes judgement.<br><b>Example:</b> reviewing a junior&rsquo;s presentation &mdash; ask what they liked first, agree &amp; add, then ask what they&rsquo;d change and offer one idea.", "dia": ""}, {"cat": "Team Dynamics", "q": "What are Tuckman&rsquo;s 5 stages of team development?", "a": "<b>What:</b> teams grow through five predictable stages, and the leader&rsquo;s job changes at each.<br>1&nbsp;<b>Forming</b> &mdash; polite, unsure, dependent (<i>lead: give direction</i>).<br>2&nbsp;<b>Storming</b> &mdash; conflict over roles &amp; approach (<i>lead: coach through it &mdash; this is normal</i>).<br>3&nbsp;<b>Norming</b> &mdash; trust &amp; norms settle (<i>lead: facilitate</i>).<br>4&nbsp;<b>Performing</b> &mdash; high autonomy &amp; output (<i>lead: delegate</i>).<br>5&nbsp;<b>Adjourning</b> &mdash; the team wraps up (<i>lead: recognise the work</i>).<br><b>Example:</b> a new SOC team argues over who owns triage (Storming) &mdash; you facilitate agreeing norms rather than forcing output.", "dia": "<svg viewBox=\"0 0 440 56\" font-family=\"Arial\"><rect x=\"3\" y=\"14\" width=\"72\" height=\"30\" rx=\"4\" fill=\"#ecfeff\" stroke=\"#0e7490\"/><text x=\"39\" y=\"33\" fill=\"#0e7490\" font-size=\"9\" text-anchor=\"middle\">Forming</text><rect x=\"90\" y=\"14\" width=\"72\" height=\"30\" rx=\"4\" fill=\"#fef2f2\" stroke=\"#b91c1c\"/><text x=\"126\" y=\"33\" fill=\"#b91c1c\" font-size=\"9\" text-anchor=\"middle\">Storming</text><rect x=\"177\" y=\"14\" width=\"72\" height=\"30\" rx=\"4\" fill=\"#fffbeb\" stroke=\"#b45309\"/><text x=\"213\" y=\"33\" fill=\"#b45309\" font-size=\"9\" text-anchor=\"middle\">Norming</text><rect x=\"264\" y=\"14\" width=\"78\" height=\"30\" rx=\"4\" fill=\"#f0fdf4\" stroke=\"#15803d\"/><text x=\"303\" y=\"33\" fill=\"#15803d\" font-size=\"9\" text-anchor=\"middle\">Performing</text><rect x=\"357\" y=\"14\" width=\"80\" height=\"30\" rx=\"4\" fill=\"#f5f3ff\" stroke=\"#6d28d9\"/><text x=\"397\" y=\"33\" fill=\"#6d28d9\" font-size=\"8.5\" text-anchor=\"middle\">Adjourning</text><text x=\"82\" y=\"33\" fill=\"#888\" font-size=\"11\" text-anchor=\"middle\">&#8250;</text><text x=\"169\" y=\"33\" fill=\"#888\" font-size=\"11\" text-anchor=\"middle\">&#8250;</text><text x=\"256\" y=\"33\" fill=\"#888\" font-size=\"11\" text-anchor=\"middle\">&#8250;</text><text x=\"349\" y=\"33\" fill=\"#888\" font-size=\"11\" text-anchor=\"middle\">&#8250;</text></svg>"}, {"cat": "Team Dynamics", "q": "What are Belbin&rsquo;s Team Roles?", "a": "<b>What:</b> (Meredith Belbin) nine natural roles people take in a team, in three families &mdash; <b>balanced teams outperform unbalanced ones</b>.<br><b>Thinking (head):</b> Plant (ideas), Monitor-Evaluator (judgement), Specialist.<br><b>Action (hands):</b> Shaper (drives), Implementer (delivers), Completer-Finisher (polishes).<br><b>People (heart):</b> Co-ordinator (organises), Teamworker (supports), Resource-Investigator (networks).<br><b>Example:</b> a team of all Shapers with no Completer-Finisher starts lots of things but ships nothing &mdash; a role gap causes the dysfunction.", "dia": "<svg viewBox=\"0 0 440 118\" font-family=\"Arial\"><rect x=\"4\" y=\"6\" width=\"140\" height=\"106\" rx=\"5\" fill=\"#ecfeff\" stroke=\"#0e7490\"/><text x=\"74\" y=\"24\" fill=\"#0e7490\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"bold\">HEAD · Thinking</text><text x=\"74\" y=\"46\" fill=\"#555\" font-size=\"8.5\" text-anchor=\"middle\">Plant (ideas)</text><text x=\"74\" y=\"64\" fill=\"#555\" font-size=\"8.5\" text-anchor=\"middle\">Monitor-Evaluator</text><text x=\"74\" y=\"82\" fill=\"#555\" font-size=\"8.5\" text-anchor=\"middle\">Specialist</text><rect x=\"150\" y=\"6\" width=\"140\" height=\"106\" rx=\"5\" fill=\"#f0fdf4\" stroke=\"#15803d\"/><text x=\"220\" y=\"24\" fill=\"#15803d\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"bold\">HANDS · Action</text><text x=\"220\" y=\"46\" fill=\"#555\" font-size=\"8.5\" text-anchor=\"middle\">Shaper (drives)</text><text x=\"220\" y=\"64\" fill=\"#555\" font-size=\"8.5\" text-anchor=\"middle\">Implementer</text><text x=\"220\" y=\"82\" fill=\"#555\" font-size=\"8.5\" text-anchor=\"middle\">Completer-Finisher</text><rect x=\"296\" y=\"6\" width=\"140\" height=\"106\" rx=\"5\" fill=\"#fffbeb\" stroke=\"#b45309\"/><text x=\"366\" y=\"24\" fill=\"#b45309\" font-size=\"9.5\" text-anchor=\"middle\" font-weight=\"bold\">HEART · People</text><text x=\"366\" y=\"46\" fill=\"#555\" font-size=\"8.5\" text-anchor=\"middle\">Co-ordinator</text><text x=\"366\" y=\"64\" fill=\"#555\" font-size=\"8.5\" text-anchor=\"middle\">Teamworker</text><text x=\"366\" y=\"82\" fill=\"#555\" font-size=\"8.5\" text-anchor=\"middle\">Resource-Investigator</text></svg>"}, {"cat": "Motivation", "q": "What is Maslow&rsquo;s Hierarchy of Needs?", "a": "<b>What:</b> human needs stack in five levels; you&rsquo;re mainly motivated by the <b>lowest unmet level</b>, and higher needs only motivate once lower ones are satisfied. A satisfied need stops motivating.<br><b>The 5 levels (bottom&rarr;top):</b> Physiological (food, sleep) &rarr; Safety (security, a job) &rarr; Social (belonging) &rarr; Esteem (recognition) &rarr; Self-Actualisation (fulfil your potential).<br><b>Example:</b> during layoffs, an &lsquo;employee of the month&rsquo; award (Esteem) falls flat &mdash; people&rsquo;s Safety need (job security) is threatened, so esteem rewards don&rsquo;t land.", "dia": "<svg viewBox=\"0 0 300 172\" font-family=\"Arial\"><rect x=\"118\" y=\"8\" width=\"84\" height=\"26\" fill=\"#f5f3ff\" stroke=\"#6d28d9\"/><text x=\"160\" y=\"25\" fill=\"#6d28d9\" font-size=\"9\" text-anchor=\"middle\">Self-Actualisation</text><rect x=\"98\" y=\"40\" width=\"124\" height=\"26\" fill=\"#eff6ff\" stroke=\"#1d4ed8\"/><text x=\"160\" y=\"57\" fill=\"#1d4ed8\" font-size=\"9.5\" text-anchor=\"middle\">Esteem</text><rect x=\"78\" y=\"72\" width=\"164\" height=\"26\" fill=\"#ecfeff\" stroke=\"#0e7490\"/><text x=\"160\" y=\"89\" fill=\"#0e7490\" font-size=\"9.5\" text-anchor=\"middle\">Social / Belonging</text><rect x=\"58\" y=\"104\" width=\"204\" height=\"26\" fill=\"#f0fdf4\" stroke=\"#15803d\"/><text x=\"160\" y=\"121\" fill=\"#15803d\" font-size=\"9.5\" text-anchor=\"middle\">Safety</text><rect x=\"38\" y=\"136\" width=\"244\" height=\"26\" fill=\"#fffbeb\" stroke=\"#b45309\"/><text x=\"160\" y=\"153\" fill=\"#b45309\" font-size=\"9.5\" text-anchor=\"middle\">Physiological</text></svg>"}, {"cat": "Motivation", "q": "What is Herzberg&rsquo;s Two-Factor Theory?", "a": "<b>What:</b> satisfaction and dissatisfaction come from <b>two separate sets of factors</b> &mdash; fixing one doesn&rsquo;t create the other.<br><b>Hygiene factors</b> (salary, conditions, policies): if bad &rarr; dissatisfaction; if good &rarr; merely &lsquo;not dissatisfied&rsquo;.<br><b>Motivators</b> (achievement, recognition, growth, responsibility): these create real satisfaction.<br><b>Example:</b> a pay rise (hygiene) stops the complaints but doesn&rsquo;t make anyone enthusiastic &mdash; giving them ownership of a project (motivator) does.", "dia": "<svg viewBox=\"0 0 340 84\" font-family=\"Arial\"><text x=\"95\" y=\"16\" fill=\"#888\" font-size=\"8\" text-anchor=\"middle\">salary · conditions</text><text x=\"248\" y=\"16\" fill=\"#888\" font-size=\"8\" text-anchor=\"middle\">growth · recognition</text><rect x=\"20\" y=\"26\" width=\"150\" height=\"26\" fill=\"#fffbeb\" stroke=\"#b45309\"/><text x=\"95\" y=\"43\" fill=\"#b45309\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"bold\">HYGIENE</text><rect x=\"180\" y=\"26\" width=\"140\" height=\"26\" fill=\"#f0fdf4\" stroke=\"#15803d\"/><text x=\"250\" y=\"43\" fill=\"#15803d\" font-size=\"10.5\" text-anchor=\"middle\" font-weight=\"bold\">MOTIVATORS</text><text x=\"95\" y=\"68\" fill=\"#888\" font-size=\"8\" text-anchor=\"middle\">prevent dissatisfaction</text><text x=\"250\" y=\"68\" fill=\"#888\" font-size=\"8\" text-anchor=\"middle\">create satisfaction</text></svg>"}, {"cat": "Motivation", "q": "What are McGregor&rsquo;s Theory X and Theory Y?", "a": "<b>What:</b> two opposite assumptions a manager can hold about people, which shape how they lead.<br><b>Theory X:</b> people dislike work, avoid responsibility, need control &amp; supervision.<br><b>Theory Y:</b> people are self-motivated, seek responsibility, and do their best when trusted.<br><b>Example:</b> a Theory-Y assumption is exactly what lets you run a hands-off (laissez-faire) style with a senior team.", "dia": ""}, {"cat": "Motivation", "q": "The 8 motivation models from the course &mdash; can you list them?", "a": "Know the first two cold, recognise the rest:<br>1&nbsp;<b>Maslow</b> &mdash; Need Hierarchy.<br>2&nbsp;<b>Herzberg</b> &mdash; Two-Factor (motivation-hygiene).<br>3&nbsp;McClelland &mdash; needs for achievement / affiliation / power.<br>4&nbsp;McGregor &mdash; Theory X / Y.<br>5&nbsp;Urwick &mdash; Theory Z.<br>6&nbsp;Argyris &mdash; maturity theory.<br>7&nbsp;Vroom &mdash; Expectancy (effort&rarr;performance&rarr;reward).<br>8&nbsp;Porter &amp; Lawler &mdash; extended Expectancy.", "dia": ""}, {"cat": "Time Management", "q": "What is the Eisenhower Matrix?", "a": "<b>What:</b> a 2&times;2 for prioritising tasks by <b>urgency</b> and <b>importance</b>.<br>Urgent + Important &rarr; <b>DO</b> now. Important, not urgent &rarr; <b>SCHEDULE</b> (good leaders spend most time here). Urgent, not important &rarr; <b>DELEGATE</b>. Neither &rarr; <b>DELETE</b>.<br><b>Example:</b> a live alert = urgent+important (do now); building a detection so it never recurs = important-not-urgent (schedule it, don&rsquo;t let &lsquo;urgent&rsquo; crowd it out).", "dia": "<svg viewBox=\"0 0 300 172\" font-family=\"Arial\"><text x=\"97\" y=\"11\" fill=\"#888\" font-size=\"8.5\" text-anchor=\"middle\">URGENT</text><text x=\"226\" y=\"11\" fill=\"#888\" font-size=\"8.5\" text-anchor=\"middle\">NOT URGENT</text><rect x=\"34\" y=\"18\" width=\"128\" height=\"64\" fill=\"#fef2f2\" stroke=\"#b91c1c\"/><text x=\"98\" y=\"46\" fill=\"#b91c1c\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"bold\">DO</text><text x=\"98\" y=\"62\" fill=\"#888\" font-size=\"7.5\" text-anchor=\"middle\">now</text><rect x=\"162\" y=\"18\" width=\"128\" height=\"64\" fill=\"#f0fdf4\" stroke=\"#15803d\"/><text x=\"226\" y=\"44\" fill=\"#15803d\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\">SCHEDULE</text><text x=\"226\" y=\"60\" fill=\"#888\" font-size=\"7.5\" text-anchor=\"middle\">lead here</text><rect x=\"34\" y=\"82\" width=\"128\" height=\"64\" fill=\"#fffbeb\" stroke=\"#b45309\"/><text x=\"98\" y=\"118\" fill=\"#b45309\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\">DELEGATE</text><rect x=\"162\" y=\"82\" width=\"128\" height=\"64\" fill=\"#f8fafc\" stroke=\"#94a3b8\"/><text x=\"226\" y=\"118\" fill=\"#555\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"bold\">DELETE</text><text x=\"22\" y=\"50\" fill=\"#888\" font-size=\"8.5\" text-anchor=\"middle\" transform=\"rotate(-90 22 50)\">IMPORTANT</text><text x=\"22\" y=\"116\" fill=\"#888\" font-size=\"8.5\" text-anchor=\"middle\" transform=\"rotate(-90 22 116)\">NOT IMP.</text></svg>"}, {"cat": "Time Management", "q": "What is the Pareto Principle (80/20 rule)?", "a": "<b>What:</b> roughly <b>80% of the results come from about 20% of the effort</b> (or causes) &mdash; so find and focus on the vital few.<br><b>Example:</b> about 20% of your controls block ~80% of the attacks &mdash; patch and monitor those first.", "dia": ""}, {"cat": "Change", "q": "What is Lewin&rsquo;s Change Model?", "a": "<b>What:</b> change in three simple moves.<br>1&nbsp;<b>Unfreeze</b> &mdash; create readiness; explain why the old way must change.<br>2&nbsp;<b>Change</b> &mdash; make the transition (the messy middle).<br>3&nbsp;<b>Refreeze</b> &mdash; lock in the new way so it doesn&rsquo;t slip back.<br><b>Key risks (deck):</b> people&rsquo;s self-interest, and misunderstanding / lack of trust.<br><b>Example:</b> a new process &mdash; a workshop to unfreeze, switch the process, then refreeze with new SOPs &amp; training.", "dia": "<svg viewBox=\"0 0 400 54\" font-family=\"Arial\"><rect x=\"6\" y=\"13\" width=\"112\" height=\"30\" rx=\"4\" fill=\"#fffbeb\" stroke=\"#b45309\"/><text x=\"62\" y=\"32\" fill=\"#b45309\" font-size=\"10\" text-anchor=\"middle\">Unfreeze</text><rect x=\"144\" y=\"13\" width=\"112\" height=\"30\" rx=\"4\" fill=\"#ecfeff\" stroke=\"#0e7490\"/><text x=\"200\" y=\"32\" fill=\"#0e7490\" font-size=\"10\" text-anchor=\"middle\">Change</text><rect x=\"282\" y=\"13\" width=\"112\" height=\"30\" rx=\"4\" fill=\"#f0fdf4\" stroke=\"#15803d\"/><text x=\"338\" y=\"32\" fill=\"#15803d\" font-size=\"10\" text-anchor=\"middle\">Refreeze</text><text x=\"131\" y=\"32\" fill=\"#888\" font-size=\"12\" text-anchor=\"middle\">&#8250;</text><text x=\"269\" y=\"32\" fill=\"#888\" font-size=\"12\" text-anchor=\"middle\">&#8250;</text></svg>"}, {"cat": "Change", "q": "What are Kotter&rsquo;s 8 Steps for leading change?", "a": "<b>What:</b> an 8-step sequence for a big organisational change.<br>1 Create urgency &rarr; 2 Build a guiding coalition &rarr; 3 Form a vision &amp; strategy &rarr; 4 Communicate the vision &rarr; 5 Empower action / remove obstacles &rarr; 6 Generate short-term wins &rarr; 7 Consolidate gains &rarr; 8 Anchor it in the culture.<br><b>Key:</b> sequential and overlapping &mdash; skipping urgency (step 1) is the #1 reason change fails.<br><b>Example:</b> rolling out MFA &mdash; open with urgency (breach stats), build a coalition, bank quick wins to keep momentum.", "dia": ""}, {"cat": "Conflict & Learning", "q": "What are the three types of conflict?", "a": "<b>What:</b> not all conflict is bad &mdash; it depends on the type.<br><b>Cognitive</b> (about tasks &amp; ideas) &mdash; <i>healthy</i>; it improves decisions.<br><b>Emotional</b> (about relationships &amp; personalities) &mdash; <i>harmful</i>; it damages the team.<br><b>Behavioural</b> (about actions &amp; conduct).<br><b>Key:</b> keep disagreements on the <b>ideas</b> (cognitive), never the people (emotional).<br><b>Example:</b> a design debate stays healthy if you argue the options, not each other.", "dia": ""}, {"cat": "Conflict & Learning", "q": "What is Argyris&rsquo;s single-loop vs double-loop learning?", "a": "<b>What:</b> two depths of learning from a mistake.<br><b>Single-loop:</b> fix the immediate error (&lsquo;patch the bug&rsquo;).<br><b>Double-loop:</b> question the <i>assumptions / process</i> that let it happen (&lsquo;why did our process let that bug ship?&rsquo;).<br><b>Example:</b> after an incident &mdash; single-loop patches the vulnerability; double-loop asks why the review missed it and changes the process.", "dia": ""}, {"cat": "Exam Meta", "q": "What 8 competencies does the oral exam assess? (Goals for Action)", "a": "1&nbsp;Efficient &amp; Effective Leadership &middot; 2&nbsp;Situative (situational) Leadership &middot; 3&nbsp;Communication &middot; 4&nbsp;Teambuilding &amp; Roles &middot; 5&nbsp;Motivation &middot; 6&nbsp;Conflict Management &middot; 7&nbsp;Change Management &middot; 8&nbsp;Training / Development.<br><b>Prep:</b> have one real story ready for each, and know which framework(s) fit each competency.", "dia": ""}, {"cat": "Exam Meta", "q": "Markus&rsquo;s golden rules for the oral?", "a": "1&nbsp;<b>Apply, don&rsquo;t recite</b> &mdash; land every framework on a real situation.<br>2&nbsp;<b>Seed the next question</b> &mdash; drop a framework name into your answer so the examiner steers toward your strengths.<br>3&nbsp;<b>Depth over breadth</b> &mdash; fewer frameworks, applied deeply (no &lsquo;shotgun&rsquo; of buzzwords).<br>4&nbsp;It&rsquo;s a <b>conversation</b> &mdash; they&rsquo;re assessing your ability to communicate.", "dia": ""}, {"cat": "Exam Meta", "q": "Exam format &amp; the answer shape?", "a": "<b>Format:</b> ~40-minute oral, 2 examiners (federal). Application + clear communication, not memorisation &mdash; framed as a relaxed conversation.<br><b>Answer shape (per framework):</b> Name it &rarr; define in one sentence &rarr; apply it to <b>your</b> real example &rarr; connect it to leading a team.<br><b>Your spine story:</b> Schroders, infrastructure engineer, a laissez-faire non-technical manager &rarr; miscommunication/conflict (covers leadership, communication &amp; conflict in one thread).", "dia": ""}];
const COLORS={"Leadership Styles": "#f87171", "Communication": "#22d3ee", "Team Dynamics": "#4ade80", "Motivation": "#fbbf24", "Time Management": "#a78bfa", "Change": "#60a5fa", "Conflict & Learning": "#f472b6", "Exam Meta": "#34d399"};
const CATS=[...new Set(CARDS.map(c=>c.cat))];
let filter='all', unknownOnly=false, deck=[], pos=0, flipped=false;
let known=new Set(JSON.parse(localStorage.getItem('m1_known')||'[]'));
const save=()=>localStorage.setItem('m1_known',JSON.stringify([...known]));

function chips(){
  const el=document.getElementById('chips');
  const mk=(id,label)=>`<div class="chip ${filter===id?'active':''}" onclick="setFilter('${id}')">${label}</div>`;
  el.innerHTML=mk('all','All')+CATS.map(c=>mk(c,c)).join('');
}
function setFilter(f){filter=f;chips();build(false);}
function toggleUnknown(){unknownOnly=document.getElementById('uonly').checked;build(false);}
function baseIdx(){return CARDS.map((c,i)=>i).filter(i=>filter==='all'||CARDS[i].cat===filter);}
function build(shuf){
  deck=baseIdx().filter(i=>!unknownOnly||!known.has(i));
  if(shuf)for(let i=deck.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[deck[i],deck[j]]=[deck[j],deck[i]];}
  pos=0;flipped=false;render();
}
function progress(){
  const base=baseIdx();const k=base.filter(i=>known.has(i)).length;
  document.getElementById('prog').textContent=`${k} / ${base.length} known`;
  document.getElementById('barfill').style.width=(base.length?100*k/base.length:0)+'%';
  document.getElementById('sub').textContent=`· ${CARDS.length} cards`;
}
function render(){
  progress();
  const stage=document.getElementById('stage');
  if(deck.length===0){
    document.getElementById('counter').textContent='';
    stage.innerHTML=`<div class="done"><h2>All caught up! 🎉</h2><p>You've marked every card in this set as known.</p><button onclick="document.getElementById('uonly').checked=false;unknownOnly=false;build(false)">Study them all again</button></div>`;
    return;
  }
  if(pos>=deck.length)pos=0;
  const i=deck[pos], c=CARDS[i], col=COLORS[c.cat]||'#22d3ee';
  document.getElementById('counter').textContent=`${pos+1} / ${deck.length}`;
  const kb=known.has(i)?'<div class="badge">✓ known</div>':'';
  if(!flipped){
    stage.innerHTML=`<div class="flashcard" onclick="flip()">${kb}<span class="cat" style="color:${col};border-color:${col}">${c.cat}</span><div class="q">${c.q}</div><div class="hint">tap to reveal the answer</div></div>`;
  }else{
    stage.innerHTML=`<div class="flashcard" onclick="flip()">${kb}<span class="cat" style="color:${col};border-color:${col}">${c.cat}</span><div class="a">${c.a}</div>${c.dia?`<div class="dia">${c.dia}</div>`:''}</div>
    <div class="controls"><button class="again" onclick="again()">↺ Review again</button><button class="got" onclick="got()">✓ Got it</button></div>
    <div class="nav"><button onclick="prev()">‹ Prev</button><button onclick="build(true)">⤨ Shuffle</button><button onclick="next()">Next ›</button></div>`;
  }
}
function flip(){flipped=!flipped;render();}
function next(){pos=(pos+1)%deck.length;flipped=false;render();}
function prev(){pos=(pos-1+deck.length)%deck.length;flipped=false;render();}
function got(){const i=deck[pos];known.add(i);save();
  if(unknownOnly){deck.splice(pos,1);}else{pos=(pos+1)%deck.length;}
  flipped=false;render();}
function again(){const id=deck.splice(pos,1)[0];deck.push(id);if(pos>=deck.length)pos=0;flipped=false;render();}
function resetKnown(){if(confirm('Reset all learned progress?')){known.clear();save();build(false);}}
chips();build(false);
</script></body></html>
